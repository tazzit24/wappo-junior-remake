<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Guappo Junior (Wappo Junior) — Puzzle Game</title>
    <!-- SEO meta tags -->
    <meta name="description" content="Wappo Junior remake (Guappo Junior) — A fan puzzle game remake featuring grid-based levels. Play online or download as a PWA">
    <meta name="keywords" content="Guappo Junior, Wappo Junior, puzzle game, web game, HTML5 game, remake, fanmade, Siemens, Softex Digital">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#191217">
    <style type="text/css">
        body {
            margin: 0;
            background-color: rgb(41, 38, 38);
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        #initial-loader {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgb(19 18 25 / 0.95);
            color: #ffffff;
            z-index: 9999;
            transition: opacity 250ms ease;
        }

        #initial-loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #initial-loader .message {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        #initial-loader .message .title {
            font-size: clamp(1.1rem, 2vw, 1.6rem);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #b1c9ff;
        }

        #initial-loader .loading-dot {
            animation: loading-dot 1.2s infinite;
        }

        #initial-loader .loading-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        #initial-loader .loading-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes loading-dot {
            0%, 20% { opacity: 0; }
            40%, 100% { opacity: 1; }
        }
    </style>
</head>

<body>
    <div id="initial-loader">
        <div class="message">
            <div class="title">
                Loading Guappo Junior<span class="loading-dot">.</span><span class="loading-dot">.</span><span class="loading-dot">.</span>
            </div>
        </div>
    </div>
    <div id="phaser-game"></div>
    <script>
        window.addEventListener('error', (event) => {
            if (event.target instanceof HTMLScriptElement) {
                const title = document.querySelector('#initial-loader .title');
                if (title) title.textContent = 'Error loading game';
            }
        }, true);
    </script>
    <script src="lib/phaser.min.js"></script>
    <script src="lib/rexuiplugin.min.js"></script>
    <script type="module" src="src/Main.js"></script>
</body>

</html>
