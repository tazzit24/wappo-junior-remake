    <!-- Make canonical/og:url absolute for crawlers; set dynamically to avoid hardcoding origin -->
    <script>
        (function() {
            try {
                var canonical = document.querySelector('link[rel="canonical"]');
                var origin = location.origin || (location.protocol + '//' + location.host);
                if (canonical && !canonical.href.startsWith('http')) {
                    canonical.href = origin + canonical.getAttribute('href');
                }
                var ogUrl = document.querySelector('meta[property="og:url"]');
                if (ogUrl && (!ogUrl.content || !ogUrl.content.startsWith('http'))) {
                    ogUrl.content = origin + (ogUrl.content || '/');
                }
                var ogImage = document.querySelector('meta[property="og:image"]');
                if (ogImage && !ogImage.content.startsWith('http')) {
                    ogImage.content = origin + ogImage.content;
                }
                var ld = document.querySelector('script[type="application/ld+json"]');
                if (ld) {
                    try {
                        var obj = JSON.parse(ld.textContent);
                        if (!obj.url) obj.url = origin + '/';
                        if (!obj.image || !obj.image.startsWith('http')) obj.image = origin + obj.image;
                        ld.textContent = JSON.stringify(obj, null, 2);
                    } catch(e) { /* ignore */ }
                }
            } catch(e) { console.warn('SEO canonical update failed', e); }
        })();
    </script>

    <script>
        (function() {
            let hasInitialized = false;
            function init() {
                if (hasInitialized) return;
                hasInitialized = true;
                const titleEl = document.querySelector('#initial-loader .title');
                
                const libs = [
                    'lib/phaser.min.js',
                    'lib/rexuiplugin.min.js'
                ];
                
                function loadScript(url) {
                    return new Promise((resolve, reject) => {
                        const xhr = new XMLHttpRequest();
                        xhr.open('GET', url, true);
                        xhr.responseType = 'blob';
                        
                        xhr.onload = (e) => {
                            if (xhr.status === 200) {
                                const blobUrl = URL.createObjectURL(xhr.response);
                                const script = document.createElement('script');
                                script.src = blobUrl;
                                script.onload = () => {
                                    URL.revokeObjectURL(blobUrl);
                                    resolve();
                                };
                                script.onerror = () => {
                                    URL.revokeObjectURL(blobUrl);
                                    reject(new Error(`Failed executing script ${url}`));
                                };
                                document.head.appendChild(script);
                            } else {
                                reject(new Error(`Failed loading ${url} (status ${xhr.status})`));
                            }
                        };
                        
                        xhr.onerror = () => reject(new Error(`Network error while loading ${url}`));
                        xhr.send();
                    });
                }

                async function boot() {
                    try {
                        for (const lib of libs) {
                            await loadScript(lib);
                        }
                        
                        // Dynamic import replaces document.createElement('script') to catch module errors
                        await import('./src/Main.js');
                    } catch (err) {
                        console.error('Boot failed:', err);
                        if (titleEl) titleEl.textContent = 'Error loading game';
                    }
                }
                
                boot();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>

    <style type="text/css">
        body {
            margin: 0;
            background-color: rgb(41, 38, 38);
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        #initial-loader {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgb(19 18 25 / 0.95);
            color: #ffffff;
            z-index: 9999;
            transition: opacity 250ms ease;
        }

        #initial-loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #initial-loader .message {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        #initial-loader .message .title {
            font-size: clamp(1.1rem, 2vw, 1.6rem);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #b1c9ff;
        }

        #initial-loader .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(177, 201, 255, 0.2);
            border-top: 3px solid #b1c9ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div id="initial-loader">
        <div class="message">
            <div class="title">Loading Guappo Junior…</div>
            <div class="spinner"></div>
        </div>
    </div>
    <div id="phaser-game"></div>
</body>
